version: "3.9"

networks:
  internal:
    driver: bridge

services:
  openbao:
    image: quay.io/openbao/openbao:latest
    ports:
      - "8200:8200"
    networks:
      - internal
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=test
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    command:
      - server
      - -dev
      - -dev-root-token-id=test
      - -dev-listen-address=0.0.0.0:8200

  init-secretengine:
    image: curlimages/curl:latest
    depends_on:
      - openbao
    environment:
      VAULT_ADDR: http://openbao:8200
      VAULT_TOKEN: test
      PEM: /usr/local/bin/test.pem
    networks:
      - internal
    volumes:
      - ./test.pem:/usr/local/bin/test.pem:ro
      - ./vault-init.sh:/usr/local/bin/vault-init.sh:ro
    entrypoint:
      - sh
      - -ec
      - sh /usr/local/bin/vault-init.sh

  # signer-service:
  #   image: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/tsa/signer:main
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - internal
  #   environment:
  #     - VAULT_ADRESS=http://openbao:8200
  #     - VAULT_TOKEN=test
  #     - NATS_HOST=nats:4222
  #     - NATS_TOPIC=signer-topic
  #     - NATS_STATUS_TOPIC=status.data.create
  #     - NATS_STATUS_VERIFY_TOPIC=status.data.verify
  #     - CLOUDEVENTPROVIDER_MESSAGING_PROTOCOL=nats
  #     - CLOUDEVENTPROVIDER_MESSAGING_NATS_URL=nats:4222
  #     - ENGINE_PATH=/opt/plugins/hashicorp-vault-provider.so

  status:
    image: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/ocm-wstack/status-list-service:1.1.1
    networks:
      - internal
    ports:
      - "8081:8080"
    environment:
      - STATUSLIST_POSTGRES_PARAMS=sslmode:disable
      - STATUSLIST_POSTGRES_HOST=postgres
      - STATUSLIST_POSTGRES_USER=postgres
      - STATUSLIST_POSTGRES_PASSWORD=postgres
      - STATUSLIST_NATS_URL=nats://nats:4222
      - STATUSLIST_SIGNER_TOPIC=signer
      - STATUSLIST_SIGNER_URL=signer-service:8080

  postgres:
    image: postgres:14-alpine
    networks:
      - internal
    ports:
      - "5432:5432"
    volumes:
      - ~/apps/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  nats:
    image: nats:2.10.10
    networks:
      - internal
    ports:
      - "4222:4222"

  sdjwt:
    image: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/common-services/sd-jwt-service:1.2.6
    ports:
      - "8082:3000"
    networks:
      - internal
    environment:
      - PORT=3000
      - SIGNER_SIGN_URL=http://host.docker.internal:8080/v1/sign
      - RESOLVER_URL=http://resolver:8080/1.0/identifiers/

  # resolver:
  #   image: transmute/restricted-resolver:latest
  #   networks:
  #     - internal
  #   ports:
  #     - "8083:8080"

  policy:
    image: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/tsa/policy:latest
    networks:
      - internal
    ports:
      - "8084:8080"
    environment:
      - POLICY_REPO_FOLDER=Policies
      - POLICY_REPOSITORY_CLONE_URL=https://gitlab.eclipse.org/eclipse/xfsc/organisational-credential-manager-w-stack/deployment.git
      - OCM_ADDR=
      - SIGNER_ADDR=http://host.docker.internal:8080/v1/sign
      - DID_RESOLVER_ADDR=http://resolver:8080/1.0/identifiers/
      - TASK_ADDR=
      - CACHE_ADDR=
      - NATS_SUBJECT=policy
      - NATS_ADDR=nats://nats:4222

  vaultPlugin:
    image: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/tsa/crypto-provider-hashicorp-vault-plugin:2.0.6
    networks:
      - internal
    ports:
      - "50051:50051"
    environment:
      - VAULT_ADRESS=http://openbao:8200
      - VAULT_TOKEN=test
      - CRYPTO_GRPC_ADDR=0.0.0.0:50051

  localPlugin:
    image: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/tsa/crypto-provider-local-plugin:v2.0.2
    networks:
      - internal
    ports:
      - "50052:50052"
    environment:
      - CRYPTO_GRPC_ADDR=0.0.0.0:50052