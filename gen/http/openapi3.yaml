                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Group.
                    default: ""
                    example: Group
                  example: Group
                - name: x-origin
                  in: header
                  description: origin for the configuration.
                  allowEmptyValue: true
                  required: true
                  schema:
                    type: string
                    description: origin for the configuration.
                    example: Nihil quidem in debitis consequatur.
                  example: Qui ut aut facilis sed quaerat doloremque.
                - name: x-did
                  in: header
                  description: did for the Configuration
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: did for the Configuration
                    example: Totam nam consequatur ea nobis est.
                  example: Deleniti debitis sunt sunt at aut adipisci.
                - name: x-nonce
                  in: header
                  description: Proof challenge
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Proof challenge
                    example: 3483492392vvv-fff
                  example: 3483492392vvv-fff
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DidConfiguration2'
                        example:
                            x-groupid: group1
                            x-signatureType: ed25519signature2020
                            x-tenantid: demotenant
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                example: Provident quo quo voluptates provident.
                            example: Quam quae.
