    /v1/jwk/{namespace}/{key}:
        get:
            tags:
                - signer
            summary: JwkPublicKey signer
            description: JwkPublicKey returns public key by name and namespace.
            operationId: signer#JwkPublicKey
            parameters:
                - name: namespace
                  in: path
                  description: Key namespace.
                  required: true
                  schema:
                    type: string
                    description: Key namespace.
                    example: transit
                  example: transit
                - name: key
                  in: path
                  description: Key name.
                  required: true
                  schema:
                    type: string
                    description: Key name.
                    example: my-ecdsa-key1
                  example: my-ecdsa-key1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/JwkPublicKeyRequest2'
                        example:
                            engine: transit
                            group: Group
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                description: Public key encoded as JSON Web Key.
                                example: Illo libero.
                            example: Optio laudantium nihil minima ut porro dicta.
                "404":
                    description: Not Found response.
                    content:
                        application/json:
