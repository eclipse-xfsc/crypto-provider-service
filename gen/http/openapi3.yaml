openapi: 3.0.3
info:
    title: Signer Service
    description: Signer service exposes HTTP API for making and verifying digital signatures and proofs for Verifiable Credentials.
    version: 0.0.1
servers:
    - url: http://localhost:8085
      description: Signer Server
paths:
    /liveness:
        get:
            tags:
                - health
            summary: Liveness health
            operationId: health#Liveness
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResponse'
                            example:
                                service: Ut occaecati repellat.
                                status: Non amet.
                                version: Nihil iste debitis.
    /readiness:
        get:
            tags:
                - health
            summary: Readiness health
            operationId: health#Readiness
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResponse'
                            example:
                                service: Sapiente dolorem qui possimus qui labore veritatis.
                                status: Fuga officia excepturi velit aut.
                                version: Natus quos ut corrupti.
    /v1/credential:
        post:
            tags:
                - signer
            summary: CreateCredential signer
            description: CreateCredential creates VC with proof from raw JSON data.
            operationId: signer#CreateCredential
            parameters:
                - name: x-origin
                  in: header
                  description: Origin of call
                  allowEmptyValue: true
                  required: true
                  schema:
                    type: string
                    description: Origin of call
                    example: https://test
                  example: https://test
                - name: x-tenantid
                  in: header
                  description: tenantid
                  allowEmptyValue: true
                  required: true
                  schema:
                    type: string
                    description: tenantid
                    example: demotenant
                  example: demotenant
                - name: x-groupid
                  in: header
                  description: Tenant Group
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Tenant Group
                    default: ""
                    example: group1
                  example: group1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCredentialRequest2'
                        example:
                            context:
                                - https://w3id.org/security/suites/jws-2020/v1
                                - https://schema.org
                            credentialSubject:
                                hello: world
                            disclosureFrame:
                                - email
                            format: ldp_vc or dc+sd-jwt
                            group: Group
                            holder: urn:3333:ddd
                            issuer: did:web:example.com
                            key: key1
                            namespace: transit
                            nonce: 3483492392vvv-fff
                            signatureType: ed25519signature2020
                            status: true
                            statuslisttype: urn:3333:ddd
                            type:
                                - VerifiableCredential
                                - TestCredential]
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                example: Exercitationem fugiat doloremque dicta.
                            example: Quo inventore enim est rem modi est.
    /v1/credential/proof:
        post:
            tags:
                - signer
            summary: CredentialProof signer
            description: CredentialProof adds a proof to a given Verifiable Credential.
            operationId: signer#CredentialProof
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CredentialProofRequest'
                        example:
                            credential:
                                context:
                                    - https://www.w3.org/2018/credentials/v1
                                    - https://w3id.org/security/suites/jws-2020/v1
                                    - https://schema.org
                                type:
                                    - VerifiableCredential
                                issuer: did:web:nginx:policy:policy:example:example:1.0:evaluation
                                issuancedate: 2010-01-01T19:23:24.651387237Z
                                credentialsubject:
                                    name: Alice
                                    allow: true
                            disclosureFrame:
                                - email
                            format: ldp_vc or dc+sd-jwt
                            group: Group
                            holder: urn:3333:ddd
                            key: key1
                            namespace: transit
                            nonce: 3483492392vvv-fff
                            signatureType: ed25519signature2020
                            status: false
                            statuslisttype: urn:3333:ddd
                            x-did: https://test
                            x-groupid: group1
                            x-origin: https://test
                            x-tenantid: demotenant
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                example: Unde magni quis.
                            example: Labore culpa alias.
    /v1/credential/verify:
        post:
            tags:
                - signer
            summary: VerifyCredential signer
            description: VerifyCredential verifies the proof of a Verifiable Credential.
            operationId: signer#VerifyCredential
            parameters:
                - name: x-format
                  in: header
                  description: format
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: format
                    default: ldp_vc
                    example: ldp_vc or dc+sd-jwt
                    enum:
                        - ldp_vc
                        - dc+sd-jwt
                  example: ldp_vc or dc+sd-jwt
                - name: x-namespace
                  in: header
                  description: Namespace for status check
                  allowEmptyValue: true
                  required: true
                  schema:
                    type: string
                    description: Namespace for status check
                    example: Esse quae explicabo odio vero neque officiis.
                  example: In consequatur aut.
                - name: x-group
                  in: header
                  description: Group for status check
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Group for status check
                    example: Est rem.
                  example: Delectus cumque voluptatem nihil neque.
                - name: x-tenantid
                  in: header
                  description: tenantid
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: tenantid
                    example: demotenant
                  example: demotenant
                - name: x-groupid
                  in: header
                  description: Group
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Group
                    example: group1
                  example: group1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VerifyCredentialRequest2'
                        example:
                            credential:
                                - 65
                                - 99
                                - 99
                                - 117
                                - 115
                                - 97
                                - 109
                                - 117
                                - 115
                                - 32
                                - 101
                                - 120
                                - 32
                                - 110
                                - 105
                                - 104
                                - 105
                                - 108
                                - 32
                                - 105
                                - 110
                                - 118
                                - 101
                                - 110
                                - 116
                                - 111
                                - 114
                                - 101
                                - 32
                                - 101
                                - 97
                                - 32
                                - 113
                                - 117
                                - 105
                                - 46
                            disclosureFrame:
                                - email
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VerifyResult'
                            example:
                                disclosedCredential: Quis fugiat qui quia et.
                                valid: true
    /v1/did/configuration:
        get:
            tags:
                - signer
            summary: DidConfiguration signer
            description: Creates did configuration.
            operationId: signer#DidConfiguration
            parameters:
                - name: x-namespace
                  in: header
